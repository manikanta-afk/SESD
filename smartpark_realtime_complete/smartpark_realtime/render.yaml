databases:
  - name: smartpark-db
    databaseName: smartpark
    user: smartpark_user
    plan: basic-256mb
services:
  - type: web
    name: smartpark-realtime
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn app:app
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartpark-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
