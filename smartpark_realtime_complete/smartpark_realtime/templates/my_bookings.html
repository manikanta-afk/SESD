<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My bookings | SmartPark</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="receipt-page"><div class="receipt card"><a class="brand" href="{{ url_for('dashboard') }}">Smart<span>Park.</span></a><h1>My bookings</h1><p class="sub">Your reservations saved in the database.</p>{% for b in bookings %}<div class="activity"><div>🅿️</div><div class="activity-main"><b>{{ b.code }}</b><div class="sub">{{ b.slot.lot.name }} · {{ b.slot.slot_number }} · {{ b.start_time.strftime('%d %b %Y, %I:%M %p') }}</div></div><a href="{{ url_for('booking_receipt',code=b.code) }}">View</a></div>{% else %}<p class="empty">No bookings yet.</p>{% endfor %}<a class="btn wide" href="{{ url_for('dashboard') }}">Back to dashboard</a></div></body></html>
